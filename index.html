<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI短视频工作流 · 一键生成爆款内容</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0f0f1a;
    --card: #1a1a2e;
    --card2: #16213e;
    --accent: #e94560;
    --gold: #f5a623;
    --purple: #7c3aed;
    --pink: #ec4899;
    --green: #10b981;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --border: rgba(255,255,255,0.08);
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    min-height: 100vh;
  }

  /* Header */
  .header {
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    border-bottom: 1px solid var(--border);
    padding: 28px 20px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .header::before {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at 50% 0%, rgba(233,69,96,0.15) 0%, transparent 70%);
  }
  .header h1 {
    font-size: clamp(22px, 5vw, 36px);
    font-weight: 800;
    background: linear-gradient(135deg, #f5a623, #e94560, #7c3aed);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    position: relative;
  }
  .header p {
    color: var(--muted);
    margin-top: 8px;
    font-size: 14px;
    position: relative;
  }
  .badge {
    display: inline-block;
    background: linear-gradient(135deg, var(--accent), var(--purple));
    color: white;
    font-size: 11px;
    padding: 2px 10px;
    border-radius: 20px;
    margin-left: 8px;
    font-weight: 600;
    vertical-align: middle;
  }

  .container { max-width: 900px; margin: 0 auto; padding: 24px 16px; }

  /* Section */
  .section {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 20px;
  }
  .section-title {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .step-num {
    width: 26px; height: 26px;
    background: linear-gradient(135deg, var(--accent), var(--purple));
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    flex-shrink: 0;
  }

  /* Style Selector */
  .style-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 10px;
    margin-bottom: 16px;
  }
  .style-btn {
    background: var(--card2);
    border: 2px solid var(--border);
    border-radius: 12px;
    padding: 12px 8px;
    cursor: pointer;
    text-align: center;
    transition: all 0.2s;
    color: var(--text);
    font-size: 13px;
  }
  .style-btn:hover { border-color: var(--accent); transform: translateY(-2px); }
  .style-btn.active { border-color: var(--accent); background: rgba(233,69,96,0.1); }
  .style-btn .emoji { font-size: 24px; display: block; margin-bottom: 6px; }

  .generate-btn {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, var(--accent), var(--purple));
    border: none;
    border-radius: 12px;
    color: white;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .generate-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(233,69,96,0.4); }
  .generate-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  /* Topic Cards */
  #topics-section { display: none; }
  .topics-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 12px;
    margin-bottom: 16px;
  }
  .topic-card {
    background: var(--card2);
    border: 2px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }
  .topic-card:hover { border-color: var(--gold); transform: translateY(-2px); }
  .topic-card.selected { border-color: var(--gold); background: rgba(245,166,35,0.08); }
  .topic-card .title { font-size: 14px; font-weight: 700; margin-bottom: 6px; }
  .topic-card .hook { font-size: 12px; color: var(--muted); margin-bottom: 8px; line-height: 1.4; }
  .topic-card .meta { display: flex; justify-content: space-between; align-items: center; }
  .topic-card .platform { font-size: 11px; color: var(--pink); }
  .viral-score {
    font-size: 12px; font-weight: 700;
    background: linear-gradient(135deg, var(--gold), var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .scene-badge {
    display: inline-block;
    font-size: 10px;
    padding: 2px 6px;
    background: rgba(124,58,237,0.2);
    color: #a78bfa;
    border-radius: 4px;
    margin-top: 4px;
  }

  /* Custom Topic Input */
  .custom-input-row {
    display: flex;
    gap: 10px;
    margin-top: 12px;
  }
  .custom-input-row input {
    flex: 1;
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    color: var(--text);
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }
  .custom-input-row input:focus { border-color: var(--accent); }
  .custom-input-row button {
    padding: 10px 18px;
    background: var(--gold);
    border: none;
    border-radius: 10px;
    color: #000;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    white-space: nowrap;
  }

  /* Pipeline */
  #pipeline-section { display: none; }
  .pipeline {
    display: flex;
    align-items: center;
    gap: 0;
    overflow-x: auto;
    padding: 8px 0;
  }
  .agent-node {
    flex-shrink: 0;
    text-align: center;
    padding: 12px 16px;
    border-radius: 12px;
    border: 2px solid var(--border);
    background: var(--card2);
    min-width: 90px;
    transition: all 0.3s;
    position: relative;
  }
  .agent-node.active {
    border-color: var(--gold);
    background: rgba(245,166,35,0.1);
    box-shadow: 0 0 20px rgba(245,166,35,0.2);
  }
  .agent-node.done {
    border-color: var(--green);
    background: rgba(16,185,129,0.08);
  }
  .agent-node .emoji { font-size: 22px; display: block; }
  .agent-node .name { font-size: 11px; margin-top: 4px; color: var(--muted); }
  .agent-node .status { font-size: 10px; margin-top: 2px; }
  .pipeline-arrow {
    flex-shrink: 0;
    color: var(--muted);
    padding: 0 6px;
    font-size: 18px;
  }
  .progress-log {
    margin-top: 14px;
    background: #0a0a14;
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 12px;
    color: var(--muted);
    font-family: 'Courier New', monospace;
    min-height: 60px;
    max-height: 140px;
    overflow-y: auto;
  }
  .progress-log .log-line { padding: 2px 0; }
  .progress-log .log-ok { color: var(--green); }
  .progress-log .log-active { color: var(--gold); }

  /* Results */
  #result-section { display: none; }
  .tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 20px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 0;
  }
  .tab-btn {
    padding: 10px 20px;
    background: none;
    border: none;
    color: var(--muted);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    transition: all 0.2s;
  }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* Script Tab */
  .script-header {
    background: linear-gradient(135deg, rgba(233,69,96,0.1), rgba(124,58,237,0.1));
    border: 1px solid rgba(233,69,96,0.2);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .script-header h2 { font-size: 18px; margin-bottom: 4px; }
  .script-meta { font-size: 12px; color: var(--muted); display: flex; gap: 16px; margin-top: 8px; flex-wrap: wrap; }
  .script-meta span { display: flex; align-items: center; gap: 4px; }

  .scene-card {
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
    display: grid;
    grid-template-columns: 36px 1fr;
    gap: 12px;
  }
  .scene-num {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, var(--accent), var(--purple));
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800;
    font-size: 14px;
    flex-shrink: 0;
  }
  .scene-body {}
  .scene-dialogue {
    font-size: 16px;
    font-weight: 700;
    color: var(--gold);
    margin-bottom: 8px;
    line-height: 1.5;
  }
  .scene-visual {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 6px;
    line-height: 1.6;
  }
  .scene-tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .tag {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 6px;
  }
  .tag-emotion { background: rgba(236,72,153,0.15); color: var(--pink); }
  .tag-camera { background: rgba(124,58,237,0.15); color: #a78bfa; }
  .tag-time { background: rgba(16,185,129,0.15); color: var(--green); }

  /* Images Tab */
  .images-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 12px;
  }
  .image-card {
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    text-align: center;
  }
  .image-card img {
    width: 100%;
    aspect-ratio: 9/16;
    object-fit: cover;
    display: block;
  }
  .image-card .img-placeholder {
    width: 100%;
    aspect-ratio: 9/16;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #0a0a14;
    color: var(--muted);
    font-size: 12px;
    gap: 6px;
  }
  .image-card .img-label {
    padding: 8px;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.3;
  }
  .generate-images-btn {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, var(--purple), var(--pink));
    border: none;
    border-radius: 12px;
    color: white;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    margin-bottom: 16px;
    transition: all 0.2s;
  }
  .generate-images-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(124,58,237,0.4); }
  .generate-images-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  /* Video generation */
  .generate-videos-btn {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #0ea5e9, #7c3aed);
    border: none;
    border-radius: 12px;
    color: white;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    margin-bottom: 16px;
    transition: all 0.2s;
  }
  .generate-videos-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(14,165,233,0.4); }
  .generate-videos-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .video-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 12px;
    margin-top: 12px;
  }
  .video-card {
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    text-align: center;
  }
  .video-card video {
    width: 100%;
    aspect-ratio: 9/16;
    object-fit: cover;
    display: block;
  }
  .video-card .video-placeholder {
    width: 100%;
    aspect-ratio: 9/16;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #0a0a14;
    color: var(--muted);
    font-size: 12px;
    gap: 6px;
  }
  .video-card .video-label {
    padding: 8px;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.3;
  }
  .video-progress {
    font-size: 11px;
    color: var(--gold);
    margin-top: 4px;
  }

  /* Caption Tab */
  .platform-block {
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 14px;
  }
  .platform-block.douyin {
    background: linear-gradient(135deg, rgba(0,0,0,0.6), rgba(15,15,25,0.9));
    border: 1px solid rgba(255,255,255,0.1);
  }
  .platform-block.xiaohongshu {
    background: linear-gradient(135deg, rgba(255,50,50,0.05), rgba(15,15,25,0.9));
    border: 1px solid rgba(255,80,80,0.2);
  }
  .platform-label {
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .caption-text {
    background: rgba(0,0,0,0.3);
    border-radius: 8px;
    padding: 12px;
    font-size: 13px;
    line-height: 1.8;
    white-space: pre-wrap;
    word-break: break-all;
    margin-bottom: 10px;
  }
  .hashtags { display: flex; flex-wrap: wrap; gap: 6px; }
  .hashtag {
    font-size: 12px;
    color: #60a5fa;
    background: rgba(96,165,250,0.1);
    padding: 3px 10px;
    border-radius: 20px;
  }
  .copy-btn {
    margin-top: 10px;
    padding: 8px 16px;
    background: rgba(255,255,255,0.08);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .copy-btn:hover { background: rgba(255,255,255,0.15); }

  /* Restart */
  .restart-btn {
    width: 100%;
    padding: 14px;
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--muted);
    font-size: 15px;
    cursor: pointer;
    transition: all 0.2s;
    margin-top: 8px;
  }
  .restart-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* Loading spinner */
  .spinner {
    display: inline-block;
    width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Toast */
  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--green); color: white;
    padding: 10px 24px; border-radius: 24px;
    font-size: 14px; font-weight: 600;
    opacity: 0; transition: opacity 0.3s; pointer-events: none;
    z-index: 9999;
  }
  #toast.show { opacity: 1; }

  @media (max-width: 600px) {
    .pipeline { gap: 0; }
    .agent-node { min-width: 72px; padding: 10px 8px; }
    .pipeline-arrow { padding: 0 2px; font-size: 14px; }
    .topics-grid { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>🎬 AI短视频工作流 <span class="badge">Beta</span></h1>
  <p>选题 → 脚本 → AI生图 → 发布文案，一键生成抖音/小红书爆款内容</p>
</div>

<div class="container">

  <!-- Step 1: Style + Topic -->
  <div class="section" id="step1-section">
    <div class="section-title">
      <span class="step-num">1</span>
      选择视频风格
    </div>
    <div class="style-grid">
      <div class="style-btn active" data-style="搞笑沙雕" onclick="selectStyle(this)">
        <span class="emoji">😂</span>搞笑沙雕
      </div>
      <div class="style-btn" data-style="温情治愈" onclick="selectStyle(this)">
        <span class="emoji">🥺</span>温情治愈
      </div>
      <div class="style-btn" data-style="职场干货" onclick="selectStyle(this)">
        <span class="emoji">💼</span>职场干货
      </div>
      <div class="style-btn" data-style="恋爱甜蜜" onclick="selectStyle(this)">
        <span class="emoji">💕</span>恋爱甜蜜
      </div>
      <div class="style-btn" data-style="悬疑反转" onclick="selectStyle(this)">
        <span class="emoji">🔮</span>悬疑反转
      </div>
      <div class="style-btn" data-style="科技未来" onclick="selectStyle(this)">
        <span class="emoji">🚀</span>科技未来
      </div>
    </div>

    <button class="generate-btn" id="topics-btn" onclick="fetchTopics()">
      🔥 获取当下热点选题
    </button>
  </div>

  <!-- Step 2: Topic Selection -->
  <div class="section" id="topics-section">
    <div class="section-title">
      <span class="step-num">2</span>
      选择你的选题（或输入自定义选题）
    </div>
    <div class="topics-grid" id="topics-grid"></div>
    <div class="custom-input-row">
      <input type="text" id="custom-topic" placeholder="💡 也可以输入你自己的选题创意..." />
      <button onclick="useCustomTopic()">用这个</button>
    </div>
    <button class="generate-btn" id="create-btn" onclick="startCreation()" style="margin-top:14px; display:none;">
      ✨ 开始AI创作
    </button>
  </div>

  <!-- Step 3: Pipeline -->
  <div class="section" id="pipeline-section">
    <div class="section-title">
      <span class="step-num">3</span>
      AI多智能体创作流水线
    </div>
    <div class="pipeline">
      <div class="agent-node" id="agent-script">
        <span class="emoji">📝</span>
        <span class="name">脚本员</span>
        <span class="status" id="status-script">等待中</span>
      </div>
      <div class="pipeline-arrow">→</div>
      <div class="agent-node" id="agent-prompt">
        <span class="emoji">🎨</span>
        <span class="name">提示词员</span>
        <span class="status" id="status-prompt">等待中</span>
      </div>
      <div class="pipeline-arrow">→</div>
      <div class="agent-node" id="agent-caption">
        <span class="emoji">✍️</span>
        <span class="name">文案员</span>
        <span class="status" id="status-caption">等待中</span>
      </div>
      <div class="pipeline-arrow">→</div>
      <div class="agent-node" id="agent-image">
        <span class="emoji">🖼️</span>
        <span class="name">生图员</span>
        <span class="status" id="status-image">等待中</span>
      </div>
    </div>
    <div class="progress-log" id="progress-log">
      <div class="log-line">⏳ 准备启动创作流水线...</div>
    </div>
  </div>

  <!-- Step 4: Results -->
  <div class="section" id="result-section">
    <div class="section-title">
      <span class="step-num">4</span>
      创作完成 🎉
    </div>
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('script')">📋 脚本分镜</button>
      <button class="tab-btn" onclick="switchTab('images')">🖼️ AI生成画面</button>
      <button class="tab-btn" onclick="switchTab('captions')">📢 发布文案</button>
    </div>

    <!-- Script Tab -->
    <div class="tab-content active" id="tab-script">
      <div class="script-header" id="script-header"></div>
      <div id="scenes-list"></div>
    </div>

    <!-- Images Tab -->
    <div class="tab-content" id="tab-images">
      <button class="generate-images-btn" id="gen-images-btn" onclick="generateImages()">
        🖼️ 生成5张分镜AI图片（Kolors模型）
      </button>
      <div class="images-grid" id="images-grid"></div>

      <!-- Video Generation -->
      <div id="video-section" style="display:none; margin-top:20px; border-top:1px solid var(--border); padding-top:20px;">
        <button class="generate-videos-btn" id="gen-videos-btn" onclick="generateVideos()">
          🎬 基于分镜图生成视频（I2V模式，人物更一致，约需2分钟）
        </button>
        <div style="font-size:12px;color:var(--muted);margin-bottom:12px;margin-top:-10px;">每段视频约3-5秒，每段消耗约¥0.2-0.5元</div>
        <div class="video-grid" id="video-grid"></div>
      </div>
    </div>

    <!-- Captions Tab -->
    <div class="tab-content" id="tab-captions">
      <div id="captions-content"></div>
    </div>

    <button class="restart-btn" onclick="restart()">🔄 重新开始，生成新内容</button>
  </div>

</div>

<div id="toast">✅ 已复制</div>

<script>
  // ===== State =====
  let selectedStyle = '搞笑沙雕';
  let selectedTopic = null;
  let resultData = null;
  let generatedImageUrls = {}; // scene_id -> url，供I2V使用
  const BASE = '';

  // ===== Style =====
  function selectStyle(el) {
    document.querySelectorAll('.style-btn').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
    selectedStyle = el.dataset.style;
  }

  // ===== Fetch Topics =====
  async function fetchTopics() {
    const btn = document.getElementById('topics-btn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> 正在分析热点...';

    try {
      const res = await fetch('/api/topics', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ style: selectedStyle })
      });
      const data = await res.json();
      if (!data.success) throw new Error(data.error || '获取失败');

      renderTopics(data.topics);
      document.getElementById('topics-section').style.display = 'block';
      document.getElementById('topics-section').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    } catch (e) {
      alert('❌ 获取选题失败: ' + e.message);
    } finally {
      btn.disabled = false;
      btn.innerHTML = '🔄 换一批热点选题';
    }
  }

  function renderTopics(topics) {
    const grid = document.getElementById('topics-grid');
    grid.innerHTML = topics.map(t => `
      <div class="topic-card" onclick="selectTopic(this, '${escHtml(t.title)}', '${escHtml(t.scene_style)}')" data-title="${escHtml(t.title)}" data-scene="${escHtml(t.scene_style)}">
        <div class="title">${t.title}</div>
        <div class="hook">${t.hook}</div>
        <div class="scene-badge">🎨 ${t.scene_style}</div>
        <div class="meta">
          <span class="platform">${t.platform}</span>
          <span class="viral-score">🔥 ${t.viral_score}/10</span>
        </div>
      </div>
    `).join('');
    selectedTopic = null;
    document.getElementById('create-btn').style.display = 'none';
  }

  function escHtml(str) {
    return String(str).replace(/'/g, '&#39;').replace(/"/g, '&quot;');
  }

  function selectTopic(el, title, scene) {
    document.querySelectorAll('.topic-card').forEach(c => c.classList.remove('selected'));
    el.classList.add('selected');
    selectedTopic = { title, scene_style: scene };
    document.getElementById('create-btn').style.display = 'flex';
  }

  function useCustomTopic() {
    const val = document.getElementById('custom-topic').value.trim();
    if (!val) { alert('请输入选题内容'); return; }
    selectedTopic = { title: val, scene_style: '现代都市' };
    document.querySelectorAll('.topic-card').forEach(c => c.classList.remove('selected'));
    document.getElementById('create-btn').style.display = 'flex';
    document.getElementById('create-btn').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  // ===== Creation Pipeline =====
  async function startCreation() {
    if (!selectedTopic) { alert('请先选择一个选题'); return; }

    document.getElementById('pipeline-section').style.display = 'block';
    document.getElementById('result-section').style.display = 'none';
    document.getElementById('create-btn').disabled = true;
    document.getElementById('pipeline-section').scrollIntoView({ behavior: 'smooth', block: 'nearest' });

    // Reset agents
    ['script','prompt','caption','image'].forEach(a => {
      document.getElementById('agent-' + a).className = 'agent-node';
      document.getElementById('status-' + a).textContent = '等待中';
    });
    const log = document.getElementById('progress-log');
    log.innerHTML = '';

    function addLog(msg, cls = '') {
      log.innerHTML += `<div class="log-line ${cls}">${msg}</div>`;
      log.scrollTop = log.scrollHeight;
    }

    function setAgentActive(name) {
      document.getElementById('agent-' + name).className = 'agent-node active';
      document.getElementById('status-' + name).textContent = '运行中...';
    }
    function setAgentDone(name) {
      document.getElementById('agent-' + name).className = 'agent-node done';
      document.getElementById('status-' + name).textContent = '✅ 完成';
    }

    try {
      addLog('🚀 启动创作流水线...', 'log-active');
      addLog(`📌 选题: ${selectedTopic.title}`);
      addLog(`🎨 风格: ${selectedStyle} | 画面: ${selectedTopic.scene_style}`);

      // All 3 text agents run together in /api/create
      setAgentActive('script');
      addLog('📝 脚本员: 正在生成5分镜脚本...', 'log-active');

      const res = await fetch('/api/create', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          topic: selectedTopic.title,
          style: selectedStyle,
          scene_style: selectedTopic.scene_style
        })
      });
      const data = await res.json();
      if (!data.success) throw new Error(data.error || '创作失败');

      setAgentDone('script');
      addLog(`✅ 脚本完成: ${data.script.scenes?.length || 0}个分镜`, 'log-ok');

      setAgentActive('prompt');
      addLog('🎨 提示词员: 已生成FLUX图片提示词', 'log-active');
      setAgentDone('prompt');
      addLog(`✅ 提示词生成: ${data.prompts?.length || 0}条`, 'log-ok');

      setAgentActive('caption');
      addLog('✍️ 文案员: 正在生成抖音/小红书文案...', 'log-active');
      setAgentDone('caption');
      addLog('✅ 文案生成完成', 'log-ok');

      addLog('');
      addLog('🎉 创作完成！点击下方查看结果', 'log-ok');

      resultData = data;
      renderResults(data);

    } catch (e) {
      addLog('❌ 创作失败: ' + e.message);
      document.getElementById('create-btn').disabled = false;
    }
  }

  // ===== Render Results =====
  function renderResults(data) {
    const { script, prompts, captions } = data;

    // Script Tab
    const header = document.getElementById('script-header');
    header.innerHTML = `
      <h2>${script.title || '视频标题'}</h2>
      <div style="font-size:13px;color:#94a3b8;margin-top:4px;">💡 核心笑点：${script.core_joke || ''}</div>
      <div class="script-meta">
        <span>🎬 ${script.scenes?.length || 0}个分镜</span>
        <span>⏱️ ${script.total_duration || 0}秒</span>
        <span>🎨 ${selectedStyle}</span>
      </div>
    `;

    const sceneList = document.getElementById('scenes-list');
    sceneList.innerHTML = (script.scenes || []).map(s => `
      <div class="scene-card">
        <div class="scene-num">${s.id}</div>
        <div class="scene-body">
          <div class="scene-dialogue">"${s.dialogue || ''}"</div>
          <div class="scene-visual">🎥 ${s.visual || ''}</div>
          <div class="scene-tags">
            <span class="tag tag-emotion">😊 ${s.emotion || ''}</span>
            <span class="tag tag-camera">📷 ${s.camera || ''}</span>
            <span class="tag tag-time">⏱️ ${s.duration || 0}秒</span>
          </div>
        </div>
      </div>
    `).join('');

    // Images Tab — init placeholders
    const grid = document.getElementById('images-grid');
    grid.innerHTML = (prompts || []).map((p, i) => `
      <div class="image-card" id="img-card-${p.scene_id}">
        <div class="img-placeholder">
          <span style="font-size:28px">🎨</span>
          <span>分镜${p.scene_id}</span>
        </div>
        <div class="img-label">${p.zh_desc || ''}</div>
      </div>
    `).join('');

    // Captions Tab
    const captionDiv = document.getElementById('captions-content');
    if (captions) {
      captionDiv.innerHTML = `
        <div class="platform-block douyin">
          <div class="platform-label">🎵 抖音文案</div>
          <div class="caption-text" id="dy-caption">${captions.douyin?.caption || ''}</div>
          <div class="hashtags">${(captions.douyin?.hashtags || []).map(h => `<span class="hashtag">#${h}</span>`).join('')}</div>
          <button class="copy-btn" onclick="copyText('dy-caption')">📋 复制文案</button>
        </div>
        <div class="platform-block xiaohongshu">
          <div class="platform-label">📕 小红书文案</div>
          <div style="font-weight:700;margin-bottom:8px;color:#f87171;">${captions.xiaohongshu?.title || ''}</div>
          <div class="caption-text" id="xhs-caption">${captions.xiaohongshu?.caption || ''}</div>
          <div class="hashtags">${(captions.xiaohongshu?.hashtags || []).map(h => `<span class="hashtag">#${h}</span>`).join('')}</div>
          <button class="copy-btn" onclick="copyText('xhs-caption')">📋 复制文案</button>
        </div>
      `;
    }

    document.getElementById('result-section').style.display = 'block';
    document.getElementById('result-section').scrollIntoView({ behavior: 'smooth', block: 'start' });
    document.getElementById('create-btn').disabled = false;
  }

  // ===== Generate Images =====
  async function generateImages() {
    if (!resultData?.prompts?.length) return;
    const btn = document.getElementById('gen-images-btn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Kolors生图中，约需30秒...';

    // Set loading state on all image cards
    (resultData.prompts || []).forEach(p => {
      const card = document.getElementById('img-card-' + p.scene_id);
      if (card) {
        const ph = card.querySelector('.img-placeholder');
        if (ph) ph.innerHTML = '<span class="spinner"></span><span style="margin-top:6px;font-size:12px;">生成中...</span>';
      }
    });

    setAgentActive('image');

    try {
      const res = await fetch('/api/image', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompts: resultData.prompts })
      });
      const data = await res.json();
      if (!data.success) throw new Error(data.error || '生图失败');

      setAgentDone('image');
      document.getElementById('progress-log').innerHTML +=
        `<div class="log-line log-ok">✅ 图片生成完成: ${data.images?.filter(i => i.success).length || 0}张成功</div>`;

      data.images?.forEach(img => {
        const card = document.getElementById('img-card-' + img.scene_id);
        if (!card) return;
        if (img.success && img.url) {
          generatedImageUrls[img.scene_id] = img.url; // 存图片URL供I2V使用
          card.querySelector('.img-placeholder')?.remove();
          const existing = card.querySelector('img');
          if (!existing) {
            const image = document.createElement('img');
            image.src = img.url;
            image.alt = `分镜${img.scene_id}`;
            card.insertBefore(image, card.firstChild);
          }
        } else {
          const ph = card.querySelector('.img-placeholder');
          if (ph) ph.innerHTML = '<span style="font-size:20px">❌</span><span style="font-size:11px;color:#ef4444;">生成失败</span>';
        }
      });

      btn.textContent = '🔄 重新生成图片';
      btn.disabled = false;
      // 图片生成完后显示视频生成区
      document.getElementById('video-section').style.display = 'block';
    } catch (e) {
      alert('❌ 图片生成失败: ' + e.message);
      btn.disabled = false;
      btn.textContent = '🖼️ 重试生成图片';
    }
  }

  function setAgentActive(name) {
    document.getElementById('agent-' + name).className = 'agent-node active';
    document.getElementById('status-' + name).textContent = '运行中...';
  }
  function setAgentDone(name) {
    document.getElementById('agent-' + name).className = 'agent-node done';
    document.getElementById('status-' + name).textContent = '✅ 完成';
  }

  // ===== Generate Videos =====
  async function generateVideos() {
    if (!resultData?.prompts?.length) return;
    const btn = document.getElementById('gen-videos-btn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> 提交视频任务中...';

    const grid = document.getElementById('video-grid');
    grid.innerHTML = resultData.prompts.map(p => `
      <div class="video-card" id="vid-card-${p.scene_id}">
        <div class="video-placeholder">
          <span style="font-size:28px">🎬</span>
          <span>分镜${p.scene_id}</span>
          <span class="video-progress" id="vid-status-${p.scene_id}">等待提交...</span>
        </div>
        <div class="video-label">${p.zh_desc || ''}</div>
      </div>
    `).join('');

    // 提交所有任务
    const jobs = [];
    for (const p of resultData.prompts) {
      try {
        document.getElementById('vid-status-' + p.scene_id).textContent = '提交中...';
        const imageUrl = generatedImageUrls[p.scene_id] || null;
        const res = await fetch('/api/video', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: p.prompt, scene_id: p.scene_id, image_url: imageUrl })
        });
        const data = await res.json();
        if (data.success && data.requestId) {
          jobs.push({ requestId: data.requestId, scene_id: p.scene_id });
          document.getElementById('vid-status-' + p.scene_id).textContent = '排队中...';
        } else {
          document.getElementById('vid-status-' + p.scene_id).textContent = '提交失败: ' + (data.details || data.error);
        }
      } catch (e) {
        document.getElementById('vid-status-' + p.scene_id).textContent = '提交出错';
      }
    }

    btn.innerHTML = `<span class="spinner"></span> 生成中（${jobs.length}个任务），请等待约2分钟...`;

    // 轮询所有任务状态
    let pending = [...jobs];
    let tries = 0;
    const maxTries = 60; // 最多轮询60次，每次5秒 = 5分钟

    while (pending.length > 0 && tries < maxTries) {
      await new Promise(r => setTimeout(r, 5000));
      tries++;

      const stillPending = [];
      for (const job of pending) {
        try {
          const res = await fetch('/api/video-status', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ requestId: job.requestId })
          });
          const data = await res.json();

          if (data.status === 'Succeed' && data.url) {
            // 替换占位符为视频播放器
            const card = document.getElementById('vid-card-' + job.scene_id);
            if (card) {
              const placeholder = card.querySelector('.video-placeholder');
              if (placeholder) {
                const video = document.createElement('video');
                video.src = data.url;
                video.controls = true;
                video.autoplay = false;
                video.loop = true;
                video.style.width = '100%';
                card.insertBefore(video, placeholder);
                placeholder.remove();
              }
            }
          } else if (data.status === 'Failed') {
            const st = document.getElementById('vid-status-' + job.scene_id);
            if (st) st.textContent = '生成失败';
          } else {
            // 还在处理中
            const st = document.getElementById('vid-status-' + job.scene_id);
            if (st) st.textContent = data.status === 'InQueue' ? '排队中...' : '生成中...';
            stillPending.push(job);
          }
        } catch (e) {
          stillPending.push(job);
        }
      }
      pending = stillPending;
    }

    if (pending.length > 0) {
      pending.forEach(job => {
        const st = document.getElementById('vid-status-' + job.scene_id);
        if (st) st.textContent = '超时，请刷新重试';
      });
    }

    btn.disabled = false;
    btn.textContent = pending.length === 0 ? '✅ 所有视频生成完成！' : '🔄 重新生成视频';
  }

  // ===== Tabs =====
  function switchTab(name) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    event.target.classList.add('active');
    document.getElementById('tab-' + name).classList.add('active');
  }

  // ===== Copy =====
  function copyText(elId) {
    const text = document.getElementById(elId)?.textContent || '';
    navigator.clipboard.writeText(text).then(() => {
      const toast = document.getElementById('toast');
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    });
  }

  // ===== Restart =====
  function restart() {
    selectedTopic = null;
    resultData = null;
    document.getElementById('topics-section').style.display = 'none';
    document.getElementById('pipeline-section').style.display = 'none';
    document.getElementById('result-section').style.display = 'none';
    document.getElementById('create-btn').style.display = 'none';
    document.getElementById('topics-btn').innerHTML = '🔥 获取当下热点选题';
    document.getElementById('topics-btn').disabled = false;
    document.getElementById('custom-topic').value = '';
    document.querySelectorAll('.topic-card').forEach(c => c.classList.remove('selected'));
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
</script>
